{% extends 'catalog/base.html' %}

{% block title %}LjРегистрация{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <h3 class="text-center mb-4 mt-3">
            {% if form.instance.pk %}
            Редактирование профиля {{ user.username }}:
            {% else %}
            Введите данные для регистрации:
            {% endif %}
        </h3>
        <div class="col-3"></div>
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="{% url 'catalog:products_list' %}" class="btn btn-warning">Отменить</a>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-3"></div>
    </div>
</div>
{% endblock %}
