{% extends 'catalog/base.html' %}

{% block title %}Удаление продукта{% endblock %}

{% block content %}
<div class="position-relative overflow-hidden p-3 p-md-5 m-md-3 text-center bg-body-tertiary">
    <div class="col-md p-lg-5 mx-auto my-5">
        <h2 class="display-4 fw-bold">Удаление продукта:</h2>
        <h2 class="display-6 text-danger">
            Вы действительно хотите удалить продукт: "{{ product.product_name|truncatechars:50 }}"
        </h2>
        <form class="mt-5" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Подтвердить</button>
            <a href="{% url 'catalog:products_list' %}" class="btn btn-primary">Отменить</a>
        </form>
    </div>
    <div class="product-device shadow-sm d-none d-md-block"></div>
    <div class="product-device product-device-2 shadow-sm d-none d-md-block"></div>
</div>
{% endblock %}
