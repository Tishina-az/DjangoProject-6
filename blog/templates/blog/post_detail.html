{% extends 'blog/base.html' %}

{% block title %}Блог{% endblock %}

{% block content %}
<div class="position-relative overflow-hidden p-3 p-md-5 m-md-3 text-center bg-body-tertiary">
    <div class="col-md p-lg-5 mx-auto my-5">
        <h1 class="display-4 fw-bold">{{ post.title }}</h1>
        <img src="{{ post.preview.url }}" class="card-img-top mt-5 mb-5" alt="Card image">
        <h3 class="fw-normal text-muted mb-3">{{ post.content }}</h3>
        <div class="d-flex gap-3 justify-content-center lead fw-normal">
            <a class="icon-link" href="{% url 'blog:posts_list' %}">
                К списку статей
                <svg class="bi"><use xlink:href="#chevron-right"/></svg>
            </a>
            <a class="icon-link" href="{% url 'blog:post_update' post.pk %}">
                Редактировать
                <svg class="bi"><use xlink:href="#chevron-right"/></svg>
            </a>
            <a class="icon-link" href="{% url 'blog:post_delete' post.pk %}">
                Удалить
                <svg class="bi"><use xlink:href="#chevron-right"/></svg>
            </a>
        </div>
        <div class="row">
            <div class="col-6 mt-5 text-body-secondary text-start">
                <p class="mb-0">Статья написана:</p>
                <p>{{ post.created_at|date:"d M Y" }}</p>
            </div>
            <div class="col-6 mt-5 text-body-secondary text-end">
                <p class="mb-0">Просмотров статьи:</p>
                <p>{{ post.number_of_views }}</p>
            </div>
        </div>
    </div>
    <div class="product-device shadow-sm d-none d-md-block"></div>
    <div class="product-device product-device-2 shadow-sm d-none d-md-block"></div>
</div>
{% endblock %}
